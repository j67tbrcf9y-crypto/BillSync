<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#EDEFEA" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BillSync" />
<title>BillSync UI Preview</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="IMG_3235.png" />
<link rel="apple-touch-icon" href="IMG_3235.png" />
</head>
<body>
<div id="root" style="font-family:-apple-system,sans-serif;padding:24px">Loading BillSync UI Preview…</div>
<script>
(async () => {
  try {
    const response = await fetch('./app-shell.html', { cache: 'no-store' });
    if (!response.ok) throw new Error(`Unable to load BillSync (${response.status})`);
    let html = await response.text();

    const storageStart = '  (function() {\n    const PREFIX = "billsync:";';
    const start = html.indexOf(storageStart);
    if (start < 0) throw new Error('Could not locate the legacy storage adapter.');
    const endMarker = '  })();\n  function Icon';
    const end = html.indexOf(endMarker, start);
    if (end < 0) throw new Error('Could not locate the end of the legacy storage adapter.');
    html = html.slice(0, start) + '  function Icon' + html.slice(end + endMarker.length);

    const reactMarker = '<script src="https://unpkg.com/react@18/umd/react.production.min.js"></' + 'script>';
    const injection = reactMarker + '\n<script src="./indexeddb-storage.js"></' + 'script>\n<script src="./auto-history.js"></' + 'script>\n<script src="./ui-redesign.js"></' + 'script>';
    if (!html.includes(reactMarker)) throw new Error('Could not locate the React loader.');
    html = html.replace(reactMarker, injection);

    const removeManualMonthControl = `\n<script>\n(() => {\n  function removeNewMonthButtons() {\n    document.querySelectorAll('button').forEach((button) => {\n      const text = (button.textContent || '').trim().toLowerCase();\n      const title = (button.getAttribute('title') || '').trim().toLowerCase();\n      if (text === 'new month' || title === 'start a new month') button.remove();\n    });\n  }\n  removeNewMonthButtons();\n  new MutationObserver(removeNewMonthButtons).observe(document.documentElement, { childList: true, subtree: true });\n})();\n</` + `script>\n`;
    html = html.replace('</body>', removeManualMonthControl + '</body>');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('root').innerHTML = '<strong>BillSync UI Preview could not start.</strong><pre style="white-space:pre-wrap">' +
      String(error && (error.stack || error.message) || error).replace(/</g, '&lt;') + '</pre>';
  }
})();
</script>
</body>
</html>
